project:
  type: website
  output-dir: _site

website:
  title: "The Price of Lahore's Air"
  description: "A satellite reconstruction of PM2.5 and its human and economic cost."
  reader-mode: true
  navbar:
    right:
      - text: "GitHub"
        href: https://github.com/momin-mustafa/lahore-air-cost
      - text: "Live app"
        href: https://lahore-air-cost.streamlit.app/

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    number-sections: false
    fig-cap-location: bottom
    code-fold: true
    smooth-scroll: true
    css: styles.css

# Publish with:  quarto publish gh-pages
